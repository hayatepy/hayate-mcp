[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[project]
name = "hayate-mcp"
version = "0.10.1"
description = "MCP Streamable HTTP for hayate across ASGI and Cloudflare Workers, with OAuth resource-server support"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuke Hayashi" }]
keywords = ["hayate", "mcp", "model-context-protocol", "workers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "hayate>=0.8.0",
  "mcp>=1.28.1,<2; sys_platform != 'emscripten'",
  "jsonschema>=4.20,<5; sys_platform == 'emscripten'",
  # pywrangler 1.15 resolves against the ABI-compatible Pyodide 0.28.3
  # index, whose rpds wasm wheel is 0.23.1.
  "rpds-py==0.23.1; sys_platform == 'emscripten'",
]

[project.urls]
Repository = "https://github.com/hayatepy/hayate-mcp"
Documentation = "https://github.com/hayatepy/hayate-mcp#readme"
Changelog = "https://github.com/hayatepy/hayate-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "mypy>=1.18",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-jsonschema>=4.23",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
